name: Keepalive

# GitHub auto-disables scheduled workflows after 60 days of no repository
# activity. This monthly heartbeat commit keeps the sync workflow alive without
# anyone having to remember to "kick" the repo. No third-party actions.
on:
  schedule:
    - cron: "0 5 1 * *"   # 1st of every month, 05:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Heartbeat commit
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .github/keepalive
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .github/keepalive
          git commit -m "chore: keepalive (prevent 60-day workflow auto-disable)" || exit 0
          git push
